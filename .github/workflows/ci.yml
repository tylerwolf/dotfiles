name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: make lint

  bootstrap-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Symlink checkout to ~/.dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Pre-seed git config
        run: |
          git config --global user.name "CI User"
          git config --global user.email "ci@dotfiles.local"
          git config --global dotfiles.managed true

      - name: Run bootstrap
        run: ./script/bootstrap

      - name: Run macOS defaults
        run: ./macos/set-defaults.sh

      - name: Run verification
        run: ./bin/dotfiles verify

      - name: Second install is a no-op
        run: |
          ./bin/dotfiles install
          if find "$HOME" -maxdepth 1 -name '*.backup' | grep .; then
            echo "second install created backups"; exit 1
          fi

      - name: dotfiles update works against this checkout
        run: |
          git -C "$HOME/.dotfiles" remote add updates "$GITHUB_WORKSPACE"
          ./bin/dotfiles update

  bootstrap-arch:
    runs-on: ubuntu-latest
    container: cachyos/cachyos:latest
    steps:
      - name: Install prerequisites
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed sudo git zsh base-devel

      - uses: actions/checkout@v4

      - name: Symlink checkout to ~/.dotfiles and pre-seed git config
        run: |
          git config --global --add safe.directory '*'
          ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"
          git config --global user.name "CI User"
          git config --global user.email "ci@dotfiles.local"
          git config --global dotfiles.managed true

      - name: Run bootstrap
        run: ./script/bootstrap

      - name: Run verification
        run: ./bin/dotfiles verify

      - name: Second install is a no-op
        run: |
          ./bin/dotfiles install
          if find "$HOME" -maxdepth 1 -name '*.backup' | grep .; then
            echo "second install created backups"; exit 1
          fi

      - name: dotfiles update works against this checkout
        run: |
          git -C "$HOME/.dotfiles" remote add updates "$GITHUB_WORKSPACE"
          ./bin/dotfiles update

      - name: dotfiles update with upgrades (interactive-run behaviour)
        run: DOTFILES_UPGRADE=1 ./bin/dotfiles update

      - name: Start zsh
        run: zsh -ic 'echo "zsh started OK"'

  bootstrap-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Symlink checkout to ~/.dotfiles
        run: ln -s "$GITHUB_WORKSPACE" "$HOME/.dotfiles"

      - name: Pre-seed git config
        run: |
          git config --global user.name "CI User"
          git config --global user.email "ci@dotfiles.local"
          git config --global dotfiles.managed true

      - name: Run bootstrap
        run: ./script/bootstrap

      - name: Run verification
        run: ./bin/dotfiles verify

      - name: Second install is a no-op
        run: |
          ./bin/dotfiles install
          if find "$HOME" -maxdepth 1 -name '*.backup' | grep .; then
            echo "second install created backups"; exit 1
          fi

      - name: dotfiles update works against this checkout
        run: |
          git -C "$HOME/.dotfiles" remote add updates "$GITHUB_WORKSPACE"
          ./bin/dotfiles update

      - name: Start zsh
        run: zsh -ic 'echo "zsh started OK"'
